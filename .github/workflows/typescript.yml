name: TypeScript

on:
  pull_request:
    paths:
      - ".github/workflows/typescript.yml"
      - "biome.json"
      - "bun.lock"
      - "package.json"
      - "scripts/**/*.ts"
      - "templates/**/*.ts"
      - "tsconfig.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/typescript.yml"
      - "biome.json"
      - "bun.lock"
      - "package.json"
      - "scripts/**/*.ts"
      - "templates/**/*.ts"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint repository TypeScript
        run: bun run lint

      - name: Type-check repository TypeScript
        run: bun run typecheck

      - name: Test managed checker
        run: bun run test:checks
