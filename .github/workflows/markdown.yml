name: Markdown

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - ".markdown-link-check.json"
      - ".markdownlint-cli2.jsonc"
      - "scripts/verify-docs.sh"
      - ".github/workflows/markdown.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - ".markdown-link-check.json"
      - ".markdownlint-cli2.jsonc"
      - "scripts/verify-docs.sh"
      - ".github/workflows/markdown.yml"

permissions:
  contents: read

jobs:
  verify-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned Markdown formatter
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          mdformat==1.0.0
          mdformat-frontmatter==2.1.2
          mdformat-gfm==1.0.0

      - name: Install documentation verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Check repository Markdown
        run: >-
          mdformat --check
          --extensions gfm
          --extensions frontmatter
          --no-codeformatters
          --wrap keep
          --end-of-line lf
          .

      - name: Verify Markdown
        run: ./scripts/verify-docs.sh
