name: Context Cost

on:
  pull_request:
    paths:
      - ".githooks/pre-commit"
      - ".github/workflows/context-cost.yml"
      - "AI-ADOPTION.md"
      - "README.md"
      - "bun.lock"
      - "metrics/context-cost-history.csv"
      - "package.json"
      - "scripts/context-cost.test.ts"
      - "scripts/context-cost-history.ts"
      - "scripts/context-cost.ts"
      - "scripts/git-hooks.ts"
      - "scripts/install-git-hooks.ts"
      - "scripts/manage-context-cost.ts"
      - "skills/bright-builds-rules/**"
      - "tsconfig.json"
  push:
    branches:
      - main
    paths:
      - ".githooks/pre-commit"
      - ".github/workflows/context-cost.yml"
      - "AI-ADOPTION.md"
      - "README.md"
      - "bun.lock"
      - "metrics/context-cost-history.csv"
      - "package.json"
      - "scripts/context-cost.test.ts"
      - "scripts/context-cost-history.ts"
      - "scripts/context-cost.ts"
      - "scripts/git-hooks.ts"
      - "scripts/install-git-hooks.ts"
      - "scripts/manage-context-cost.ts"
      - "skills/bright-builds-rules/**"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  verify-context-cost:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check repository scripts
        run: bun run typecheck

      - name: Test context-cost behavior
        run: bun run test:context-cost

      - name: Verify current snapshot and append-only history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_ref=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
          fi

          if [[ -n "$base_ref" ]]; then
            bun run context-cost:check -- --base-ref "$base_ref"
          else
            bun run context-cost:check
          fi
